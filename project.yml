# Projektbeschreibung für XcodeGen – daraus erzeugt GitHub beim Bauen das Xcode-Projekt.
name: Couchmatch
options:
  bundleIdPrefix: com.pkrasikow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Couchmatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: Couchmatch
        PRODUCT_BUNDLE_IDENTIFIER: com.pkrasikow.couchmatch
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: "NO"
        TMDB_API_KEY: ""
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
